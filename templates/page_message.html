<!DOCTYPE html>
<html
  th:lang="#{meta.lang}"
  lang="zh-CN"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:halo="https://halo.run"
>
  <head>
    <th:block
      th:replace="~{modules/head :: head(title=|${singlePage.spec.title} - ${site.title}|, desc=${singlePage.status.excerpt}, image=null, canonical=${singlePage.status.permalink}, type='article')}"
    ></th:block>
  </head>
  <body>
    <a class="x-skip-link" href="#main" th:text="#{a11y.skipToContent}">跳到主内容</a>
    <div
      class="x-shell"
      th:with="pf=${theme.config.profile},
               xavatar=${pf?.avatar ?: (site.logo ?: ('/themes/theme-x/assets/images/avatar.svg'))}"
    >
      <th:block th:replace="~{modules/nav :: nav(current='')}"></th:block>

      <main class="x-feed" id="main" tabindex="-1">
        <th:block th:replace="~{modules/mobile :: top(root=false)}"></th:block>

        <header class="x-header">
          <div class="x-header-bar">
            <button class="x-header-back" type="button" data-go-back th:aria-label="#{common.back}">
              <iconify-icon icon="ri:arrow-left-line" aria-hidden="true"></iconify-icon>
            </button>
            <h1 class="x-header-title" th:text="${singlePage.spec.title}"></h1>
          </div>
        </header>

        <!--/* 留言板：正文当开场白，下面直接是评论区 */-->
        <div class="x-intro">
          <img class="x-avatar" th:src="${xavatar}" alt="" loading="lazy" />
          <div class="x-intro-main">
            <div class="x-prose" style="font-size: 1.0666rem; padding: 8px 0" th:utext="${singlePage.content.content}"></div>
          </div>
        </div>

        <section class="x-comments" id="comments" th:if="${singlePage.spec.allowComment and haloCommentEnabled}">
          <th:block th:replace="~{modules/tweet :: commentsHead(count=${singlePage.stats.comment})}"></th:block>
          <div class="x-comments-widget"><halo:comment group="content.halo.run" kind="SinglePage" th:attr="name=${singlePage.metadata.name}" /></div>
        </section>
      </main>

      <th:block th:replace="~{modules/aside :: aside}"></th:block>
    </div>

    <th:block th:replace="~{modules/mobile :: tabbar(current='')}"></th:block>
    <th:block th:replace="~{modules/mobile :: drawer(current='', root=false)}"></th:block>
    <th:block th:replace="~{modules/dialogs :: dialogs}"></th:block>
  </body>
</html>

<!DOCTYPE html>
<html
  th:lang="#{meta.lang}"
  lang="zh-CN"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:halo="https://halo.run"
>
  <head>
    <th:block
      th:replace="~{modules/head :: head(title=|${singlePage.spec.title} - ${site.title}|, desc=${singlePage.status.excerpt}, image=${singlePage.spec.cover}, canonical=${singlePage.status.permalink}, type='article')}"
    ></th:block>
  </head>
  <body>
    <a class="x-skip-link" href="#main" th:text="#{a11y.skipToContent}">跳到主内容</a>
    <div class="x-shell">
      <th:block th:replace="~{modules/nav :: nav(current='')}"></th:block>

      <main class="x-feed" id="main" tabindex="-1">
        <th:block th:replace="~{modules/mobile :: top(root=false)}"></th:block>

        <header class="x-header">
          <div class="x-header-bar">
            <button class="x-header-back" type="button" data-go-back th:aria-label="#{common.back}">
              <iconify-icon icon="ri:arrow-left-line" aria-hidden="true"></iconify-icon>
            </button>
            <div>
              <h1 class="x-header-title" th:text="${singlePage.spec.title}"></h1>
              <div class="x-header-sub" th:with="cnt=${singlePage.stats.visit ?: 0}" th:text="${cnt + #messages.msg(cnt == 1 ? 'post.viewSuffix' : 'post.viewsSuffix')}"></div>
            </div>
            <div class="x-header-actions">
              <button
                class="x-icon-button"
                type="button"
                data-share
                th:aria-label="#{action.share}"
                th:attr="data-permalink=${singlePage.status.permalink}, data-title=${singlePage.spec.title}"
              >
                <iconify-icon icon="ri:share-line" aria-hidden="true"></iconify-icon>
              </button>
            </div>
          </div>
        </header>

        <div class="x-media" data-count="1" th:if="${not #strings.isEmpty(singlePage.spec.cover)}"
             style="margin: 0; border-radius: 0; border: 0; border-bottom: 1px solid var(--border)">
          <img th:src="${singlePage.spec.cover}" th:alt="${singlePage.spec.title}" data-lightbox data-alt-skip />
        </div>

        <article style="padding: 16px; border-bottom: 1px solid var(--border)">
          <h2 class="x-detail-title" th:text="${singlePage.spec.title}"></h2>
          <div class="x-prose" data-prose th:utext="${singlePage.content.content}"></div>
        </article>

        <section class="x-comments" id="comments" th:if="${singlePage.spec.allowComment and haloCommentEnabled}">
          <th:block th:replace="~{modules/tweet :: commentsHead(count=${singlePage.stats.comment})}"></th:block>
          <div class="x-comments-widget"><halo:comment group="content.halo.run" kind="SinglePage" th:attr="name=${singlePage.metadata.name}" /></div>
        </section>
      </main>

      <th:block th:replace="~{modules/aside :: aside}"></th:block>
    </div>

    <th:block th:replace="~{modules/mobile :: tabbar(current='')}"></th:block>
    <th:block th:replace="~{modules/mobile :: drawer(current='', root=false)}"></th:block>
    <th:block th:replace="~{modules/dialogs :: dialogs}"></th:block>
  </body>
</html>

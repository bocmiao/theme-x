apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-theme-x-updater-check
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
    # 能管理主题的角色自动带上「查最新版本」这一条，不用单独授权
    rbac.authorization.halo.run/aggregate-to-role-template-manage-themes: "true"
  annotations:
    rbac.authorization.halo.run/module: "Themes Management"
    rbac.authorization.halo.run/display-name: "检查 theme-x 更新"
rules:
  - apiGroups: ["console.api.themexupdater.halo.run"]
    resources: ["themes/latest", "themes/plugin-jar"]
    verbs: ["get"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-theme-x-link-health
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
    # 能管理友链的角色（「链接」插件的 role-template-link-manage）自动带上友链体检
    rbac.authorization.halo.run/aggregate-to-role-template-link-manage: "true"
  annotations:
    rbac.authorization.halo.run/module: "Links"
    rbac.authorization.halo.run/display-name: "友链体检"
rules:
  - apiGroups: ["console.api.themexupdater.halo.run"]
    resources: ["linkhealth"]
    verbs: ["get", "list", "create"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-theme-x-slug-next
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
    # 能写文章的人（后台文章管理、个人中心投稿）保存时要问下一个编号
    rbac.authorization.halo.run/aggregate-to-role-template-manage-posts: "true"
    rbac.authorization.halo.run/aggregate-to-role-template-post-contributor: "true"
  annotations:
    rbac.authorization.halo.run/module: "Posts Management"
    rbac.authorization.halo.run/display-name: "文章别名按日期编号"
rules:
  - apiGroups: ["console.api.themexupdater.halo.run"]
    resources: ["slugs/next"]
    verbs: ["get", "list"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-theme-x-writing
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
    # 改的是系统设置（别名策略、摘要生成器），跟着「插件管理」走
    rbac.authorization.halo.run/aggregate-to-role-template-manage-plugins: "true"
  annotations:
    rbac.authorization.halo.run/module: "Plugins Management"
    rbac.authorization.halo.run/display-name: "写作助手"
rules:
  - apiGroups: ["console.api.themexupdater.halo.run"]
    resources: ["writing", "writing/slug-strategy", "writing/ai-activate", "writing/ai-test", "writing/ai-regenerate"]
    verbs: ["get", "list", "create"]

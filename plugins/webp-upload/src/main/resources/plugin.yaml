apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: webp-upload
spec:
  enabled: true
  requires: ">=2.20.0"
  author:
    name: Miao
    website: https://github.com/bocmiao
  logo: logo.svg
  homepage: https://github.com/bocmiao/theme-x
  repo: https://github.com/bocmiao/theme-x
  displayName: "上传自动转 WebP"
  description: "上传前在浏览器里把 PNG / JPEG 转成 WebP，体积通常只剩三分之一。服务器不用装任何东西，附件库、编辑器里粘贴的图片、主题设置里选图上传都走这一条路。"
  license:
    - name: MIT
  version: 1.1.0
  settingName: webp-upload-settings
  configMapName: webp-upload-configmap

apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-x-setting
spec:
  forms:
    # ================================================================ 个人资料
    - group: profile
      label: 个人资料
      formSchema:
        - $formkit: select
          name: byline
          label: 文章卡片上的署名
          value: site
          help: 单人博客选「用这里的资料」，全站只认这一套名字和头像，Halo 账号里的显示名称、头像不用再管；多人博客选「用各自的 Halo 账号」，每篇文章显示真正的作者（这时左栏等处仍用这里的资料）
          options:
            - label: 用这里的资料（单人博客）
              value: site
            - label: 用各文章作者的 Halo 账号（多人博客）
              value: author
        - $formkit: attachment
          name: avatar
          label: 头像
          help: 左栏、手机抽屉、关于页、留言板、评论区提示，以及（署名选「用这里的资料」时）所有文章和瞬间卡片都用这张。留空则用站点 Logo
          accepts:
            - "image/*"
        - $formkit: attachment
          name: banner
          label: 个人主页横幅
          help: 关于页与作者页顶部的大图，建议 1500×500
          accepts:
            - "image/*"
        - $formkit: text
          name: name
          label: 显示名
          help: 留空则使用站点标题
        - $formkit: text
          name: handle
          label: 用户名
          value: "blog"
          help: 不用带 @，会自动补上
        - $formkit: select
          name: verified
          label: 认证标记
          value: "blue"
          help: 显示名后面的小蓝勾
          options:
            - label: 蓝色（个人）
              value: blue
            - label: 金色（组织）
              value: gold
            - label: 灰色（政府）
              value: gray
            - label: 不显示
              value: "off"
        - $formkit: textarea
          name: bio
          label: 简介
          rows: 3
          help: 个人主页头像下方的几行字
        - $formkit: text
          name: location
          label: 所在地
        - $formkit: text
          name: website
          label: 个人网站
        - $formkit: text
          name: joined
          label: 加入时间
          help: 例如「2024 年 3 月」，留空则不显示
        - $formkit: text
          name: following
          label: 正在关注
          help: 个人主页的关注数，留空则用分类数量
        - $formkit: text
          name: followers
          label: 关注者
          help: 留空则用站点总访问量

    # ================================================================ 左栏导航
    - group: nav
      label: 左栏导航
      formSchema:
        - $formkit: attachment
          name: logo
          label: 站点图标
          help: 左上角的标志，留空则用内置的 X
          accepts:
            - "image/*"
        - $formkit: checkbox
          name: items
          label: 内置导航项
          help: 「瞬间」「图库」「友链」要先装对应的插件才有页面，没装就别勾，否则点进去是 404。「书签」需要你自己建一个别名为 bookmarks 的页面（模板选「书签」），不建也能用——会落到 404 页上由脚本兜底显示。
          value:
            - home
            - explore
            - categories
            - tags
            - bookmarks
            - profile
          options:
            - label: 首页
              value: home
            - label: 探索
              value: explore
            - label: 分类
              value: categories
            - label: 标签
              value: tags
            - label: 书签
              value: bookmarks
            - label: 个人资料
              value: profile
            - label: 瞬间
              value: moments
            - label: 图库
              value: photos
            - label: 友链
              value: links
        - $formkit: repeater
          name: extra
          label: 额外导航项
          value: []
          help: 追加在内置项下面。图标填 iconify 名称，例如 ri:mail-line
          children:
            - $formkit: text
              name: icon
              label: 图标
              value: "ri:hashtag"
            - $formkit: text
              name: text
              label: 文字
            - $formkit: text
              name: link
              label: 链接
        - $formkit: text
          name: profile_link
          label: 「个人资料」指向的地址
          value: "/about"
          help: 左栏、手机底栏和抽屉里的「个人资料」都跳这里。站点得真有这个地址的页面——Halo 初始化时自带一个别名为 about 的页面，删掉或改名了就要在这里改
        - $formkit: select
          name: tabbar_fourth
          label: 手机底栏第四个位置
          value: bookmarks
          help: 手机底栏最多五格，前三格固定是首页、探索、分类，最后一格固定是个人资料，中间这格可以自己挑。「友链」「瞬间」「图库」要先装对应插件，没装就别选，否则点进去是 404；选「书签」还得「功能 → 书签」是开着的，关掉的话这格会空出来，底栏只剩四格
          options:
            - label: 书签
              value: bookmarks
            - label: 友链
              value: links
            - label: 瞬间
              value: moments
            - label: 图库
              value: photos
            - label: 标签
              value: tags
            - label: 不显示（底栏只留四格）
              value: "off"
        - $formkit: text
          name: media_link
          label: 「媒体」标签指向的地址
          help: 留空则个人主页不显示「媒体」标签。想用的话先在后台新建一个页面、自定义模板选「媒体」，再把它的地址（比如 /media）填在这里
        - $formkit: text
          name: post_button_text
          label: 发帖按钮文字
        - $formkit: text
          name: post_button_link
          label: 发帖按钮链接
          value: "/console/posts/editor"

    # ================================================================ 首页
    - group: home
      label: 首页
      formSchema:
        - $formkit: text
          name: tab_primary
          label: 第一个标签页
        - $formkit: text
          name: tab_secondary
          label: 第二个标签页
          help: 留空则不显示标签栏（第一个标签页的文字也随之不显示）。不填则跟随站点语言显示「正在关注 / Following」
        - $formkit: select
          name: tab_secondary_source
          label: 第二个标签页取什么内容
          value: "hot"
          help: 选「友链」最接近 X 的「正在关注」：给友链填了 RSS 地址（并在链接插件的设置里打开「公开 RSS 订阅动态」）就显示朋友们的最新文章，否则显示友链列表。要装「链接」插件
          options:
            - label: 最多访问
              value: hot
            - label: 指定分类
              value: category
            - label: 友链（朋友们的最新文章，没有就列友链）
              value: links
        - $formkit: categorySelect
          name: tab_secondary_category
          label: 指定的分类
          help: 上一项选「指定分类」时生效
        - $formkit: select
          name: compose
          label: 顶部发帖框
          value: "on"
          options:
            - label: 显示
              value: "on"
            - label: 隐藏
              value: "off"
        - $formkit: text
          name: compose_placeholder
          label: 发帖框提示语
        - $formkit: select
          name: compose_hint
          label: 发帖框里换成一句话
          value: "off"
          help: 把「有什么新鲜事？」换成随机的一句一言（动漫、文学、影视、诗词、哲学）或一句古诗词，访客每次打开博客换一句。数据是访客的浏览器直接去 api.miao.club 拿的（主题没有服务端），默认关，要不要让访客连第三方由你决定。拿不到时照常显示上面的提示语。
          options:
            - label: 不换（用上面的提示语）
              value: "off"
            - label: 一言
              value: hitokoto
            - label: 古诗词
              value: poem
        - $formkit: select
          name: media_grid
          label: 封面图排版
          value: "on"
          help: 把文章封面按 X 的媒体卡片样式铺在正文下方
          options:
            - label: 开启
              value: "on"
            - label: 关闭
              value: "off"

    # ================================================================ 文章
    - group: post
      label: 文章
      formSchema:
        - $formkit: select
          name: link_cards
          label: 正文链接变成卡片
          value: "off"
          help: 正文里单独占一段的链接（这一段只有这一个链接），会变成 X 那样带标题、摘要和配图的卡片；链接夹在句子里的不动。网页信息由访客浏览器去 api.miao.club 取，在访客本地缓存 7 天。默认关，要不要让访客连第三方由你决定。
          options:
            - label: 开启
              value: "on"
            - label: 关闭
              value: "off"
        - $formkit: select
          name: cover_fallback
          label: 没设封面时用正文首图
          value: "on"
          help: 文章没设封面时，列表里的封面退回正文里的第一张图。代价是渲染这些文章的卡片要多读一次正文（只对没设封面的文章），站点很大又在意首页开销的话可以关掉。「媒体」页只认真正设了封面的文章，不受这一项影响
          options:
            - label: 开启
              value: "on"
            - label: 关闭（只用设定的封面）
              value: "off"
        - $formkit: select
          name: actions
          label: 互动栏
          value: "on"
          help: 回复 / 转发 / 喜欢 / 浏览量 / 收藏 / 分享
          options:
            - label: 显示
              value: "on"
            - label: 隐藏
              value: "off"
        - $formkit: select
          name: excerpt
          label: 时间线里的正文
          value: "both"
          options:
            - label: 标题加摘要
              value: both
            - label: 只要摘要
              value: excerpt
            - label: 只要标题
              value: title
        - $formkit: select
          name: post_nav
          label: 上一篇 / 下一篇
          value: "on"
          options:
            - label: 显示
              value: "on"
            - label: 隐藏
              value: "off"
        - $formkit: number
          name: related_count
          number: "integer"
          label: 相关文章数量
          value: 4
          help: 填 0 则不显示
        - $formkit: number
          name: series_count
          number: "integer"
          label: 系列最多列几篇
          value: 30
          min: 1
          max: 100
          help: 把某个分类的自定义模板选成「系列」，它下面的文章就是一个系列；文章页会显示「本系列第几篇」和整个目录
        - $formkit: number
          name: media_count
          number: "integer"
          label: 媒体页显示数量
          value: 60
          min: 1
          max: 300
          help: 「媒体」标签页最多铺多少张封面，超出的引到归档页（最多往前翻 500 篇文章找封面）
        - $formkit: select
          name: toc
          label: 文章目录
          value: "on"
          help: 目录从正文里的二、三、四级标题自动生成，标题少于两个就不显示
          options:
            - label: 只在「长文」模板里显示
              value: "on"
            - label: 所有文章都显示
              value: "all"
            - label: 不显示
              value: "off"
        - $formkit: select
          name: outline
          label: 右栏文章大纲
          value: "on"
          help: 宽屏上文章页右栏最上面显示「文章大纲」（正文里的一到四级标题），点一下跳过去，读到哪一段亮哪一条，往下翻时一直钉在搜索框下面。标题少于两个不显示；正文开头那个和文章标题一样的一级标题不算。开着的时候宽屏上正文里的目录不再重复显示；手机没有右栏，还是按上面「文章目录」的设置。
          options:
            - label: 显示
              value: "on"
            - label: 不显示
              value: "off"
        - $formkit: select
          name: read_time
          label: 字数与阅读时长
          value: "on"
          help: 中文按每分钟 400 字、英文按每分钟 220 词估算
          options:
            - label: 只在「长文」模板里显示
              value: "on"
            - label: 所有文章都显示
              value: "all"
            - label: 不显示
              value: "off"
        - $formkit: select
          name: copyright
          label: 版权声明
          value: "on"
          options:
            - label: 显示
              value: "on"
            - label: 隐藏
              value: "off"
        - $formkit: textarea
          name: copyright_text
          label: 版权文字
          rows: 2

    # ================================================================ 打赏
    - group: tip
      label: 打赏
      formSchema:
        - $formkit: select
          name: enabled
          label: 打赏
          value: "off"
          help: 下面至少要配一种收款方式，按钮才会出现
          options:
            - label: 关闭
              value: "off"
            - label: 开启
              value: "on"
        - $formkit: checkbox
          name: position
          label: 按钮位置
          help: 一个都不勾就等于关掉
          value:
            - post
            - profile
          options:
            - label: 文章末尾
              value: post
            - label: 个人资料页
              value: profile
        - $formkit: text
          name: button_text
          label: 按钮文字
          help: 留空则显示「赞赏」
        - $formkit: text
          name: title
          label: 弹窗标题
          help: 留空则显示「请我喝杯咖啡」
        - $formkit: textarea
          name: desc
          label: 弹窗说明
          rows: 2
        - $formkit: attachment
          name: wechat
          label: 微信收款码
          accepts:
            - image/*
        - $formkit: attachment
          name: alipay
          label: 支付宝收款码
          accepts:
            - image/*
        - $formkit: text
          name: custom_label
          label: 第三种收款方式的名称
          help: 例如 QQ、Buy Me a Coffee；留空则显示「其他」
        - $formkit: attachment
          name: custom_qr
          label: 第三种收款码
          accepts:
            - image/*
        - $formkit: text
          name: link_text
          label: 站外收款页文字
          help: 例如「在爱发电支持我」
        - $formkit: text
          name: link_url
          label: 站外收款页链接
          help: 爱发电 / Ko-fi / Buy Me a Coffee / PayPal 这类页面的地址

    # ================================================================ 友链页
    - group: links
      label: 友链页
      formSchema:
        - $formkit: select
          name: apply
          label: 友链申请入口
          value: "on"
          help: 在友链页底部显示「我的友链信息」和申请表单。表单走「链接」插件的申请接口，需要在插件设置的「友链申请」里打开「启用友链申请」和「允许访客提交」；没开的话访客点开会看到一句说明，你的信息照常显示
          options:
            - label: 显示
              value: "on"
            - label: 不显示
              value: "off"
        - $formkit: text
          name: my_name
          label: 我的站点名称
          help: 留空则用站点标题
        - $formkit: text
          name: my_url
          label: 我的站点地址
          help: 留空则用站点地址
        - $formkit: attachment
          name: my_logo
          label: 我的头像 / Logo
          help: 留空则用「个人资料 → 头像」
        - $formkit: text
          name: my_desc
          label: 我的一句话描述
          help: 留空则用站点副标题
        - $formkit: textarea
          name: apply_note
          label: 申请须知
          rows: 4
          help: 显示在申请表单上方。留空则用一段默认文案（先加本站、内容健康、长期有效）
        - $formkit: select
          name: apply_autofill
          label: 申请表单自动填写
          value: "off"
          help: 访客填好网址后，自动按对方网站上的信息填好名称、简介和头像（空着的才填，访客可以改）。网页信息由访客浏览器去 api.miao.club 取。
          options:
            - label: 开启
              value: "on"
            - label: 关闭
              value: "off"

    # ================================================================ 右栏
    - group: sidebar
      label: 右栏
      formSchema:
        - $formkit: select
          name: search
          label: 搜索框
          value: "on"
          options:
            - label: 显示
              value: "on"
            - label: 隐藏
              value: "off"
        - $formkit: text
          name: search_placeholder
          label: 搜索框提示语
        - $formkit: select
          name: promo
          label: 订阅卡片
          value: "on"
          options:
            - label: 显示
              value: "on"
            - label: 隐藏
              value: "off"
        - $formkit: text
          name: promo_title
          label: 订阅卡标题
        - $formkit: textarea
          name: promo_text
          label: 订阅卡正文
          rows: 2
        - $formkit: text
          name: promo_button
          label: 订阅卡按钮文字
        - $formkit: text
          name: promo_link
          label: 订阅卡按钮链接
          value: "/rss.xml"
        - $formkit: select
          name: trends
          label: 趋势卡片
          value: "tag"
          help: 「全网热榜」显示微博、知乎、B 站等平台此刻的热榜，数据是访客的浏览器直接去 api.miao.club 拿的（主题没有服务端），默认关，要不要让访客连第三方由你决定。
          options:
            - label: 按标签
              value: tag
            - label: 按分类
              value: category
            - label: 全网热榜（api.miao.club）
              value: hot
            - label: 隐藏
              value: "off"
        - $formkit: checkbox
          name: trends_hot
          label: 热榜来源
          value:
            - weibo
            - zhihu
            - bilibili
            - ithome
          help: 趋势卡片选「全网热榜」时才用。勾了几个，卡片标题下面就有几个按钮，访客点哪个看哪个；条目数用下面的「趋势条目数」。哪个来源一时拿不到就自动不显示——接口服务器在国内，GitHub、V2EX、Hacker News 偶尔连不上。
          options:
            - label: 微博热搜
              value: weibo
            - label: 知乎热榜
              value: zhihu
            - label: B 站热门
              value: bilibili
            - label: 抖音热点
              value: douyin
            - label: 百度热搜
              value: baidu
            - label: 今日头条
              value: toutiao
            - label: GitHub Trending
              value: github
            - label: V2EX
              value: v2ex
            - label: IT之家
              value: ithome
            - label: 36氪
              value: 36kr
            - label: 少数派
              value: sspai
            - label: Hacker News
              value: hackernews
        - $formkit: text
          name: trends_title
          label: 趋势卡标题
        - $formkit: number
          name: trends_count
          number: "integer"
          min: 1
          max: 20
          label: 趋势条目数
          value: 6
        - $formkit: select
          name: history
          label: 「历史上的今天」卡片
          value: "off"
          help: 右栏列出历史上今天发生的事、出生和逝世的人，点了去百度百科。数据是访客的浏览器直接去 api.miao.club 拿的（主题没有服务端），默认关，要不要让访客连第三方由你决定。一个访客一天只拿一次。
          options:
            - label: 显示
              value: "on"
            - label: 隐藏
              value: "off"
        - $formkit: number
          name: history_count
          number: "integer"
          min: 1
          max: 20
          label: 「历史上的今天」先显示几条
          value: 4
          help: 剩下的点「显示更多」展开。
        - $formkit: select
          name: follow
          label: 推荐关注卡片
          value: "on"
          options:
            - label: 显示
              value: "on"
            - label: 隐藏
              value: "off"
        - $formkit: text
          name: follow_title
          label: 推荐关注标题
        - $formkit: repeater
          name: follow_items
          label: 推荐关注列表
          value: []
          children:
            - $formkit: attachment
              name: avatar
              label: 头像
              accepts:
                - "image/*"
            - $formkit: text
              name: name
              label: 昵称
            - $formkit: text
              name: handle
              label: 用户名
            - $formkit: text
              name: link
              label: 链接
        - $formkit: repeater
          name: footer_links
          label: 页脚链接
          value: []
          children:
            - $formkit: text
              name: text
              label: 文字
            - $formkit: text
              name: link
              label: 链接
        - $formkit: text
          name: icp
          label: ICP 备案号
          help: 例如 豫ICP备20014910号-5。填了就会出现在页脚并链到工信部备案系统；留空则不显示。在中国大陆境内提供服务的网站这是必须的
        - $formkit: text
          name: copyright
          label: 页脚版权
          help: 留空则显示「© 年份 站点标题」
        - $formkit: checkbox
          name: sticky_widgets
          label: 跟随滚动的小组件
          help: 勾选的小组件在页面往下翻时会一直跟在右边（右栏比屏幕高时，翻到底停住、往回翻到顶停住，和 X 一样）；没勾选的排在上面，随页面滚走。搜索框始终吸顶。
          value:
            - promo
            - trends
            - follow
            - epic
            - history
            - footer
          options:
            - label: 订阅卡片
              value: promo
            - label: 趋势卡片
              value: trends
            - label: 推荐关注
              value: follow
            - label: 游戏限免
              value: epic
            - label: 历史上的今天
              value: history
            - label: 页脚
              value: footer

    # （「历史上的今天」卡片的开关放在「右栏」分组里，和其它右栏卡片在一起）

    # ================================================================ 游戏限免（配置键沿用 epic，老配置不用迁移）
    - group: epic
      label: 游戏限免
      formSchema:
        - $formkit: select
          name: enabled
          label: 右栏「游戏限免」卡片
          value: "off"
          help: 展示 Epic / Steam / GOG 上限时免费领取的游戏。默认关闭——数据是访客的浏览器直接去接口取的（这些商店的接口不允许跨域，主题没有服务端，只能这么拿），要不要让访客连第三方由你决定。拿不到数据时卡片自动不出现。
          options:
            - label: 显示
              value: "on"
            - label: 隐藏
              value: "off"
        - $formkit: checkbox
          name: platforms
          label: 显示哪些平台
          value:
            - epic
          help: 可以多选。Epic 每周四换一批，几乎每周都有；Steam 和 GOG 的限免隔一阵子才有一次，没有的时候卡片里就只显示有的那几家。Steam 和 GOG 的数据来自 api.miao.club；下面的「Epic 数据接口」只管 Epic。
          options:
            - label: Epic Games Store
              value: epic
            - label: Steam
              value: steam
            - label: GOG
              value: gog
        - $formkit: text
          name: title
          label: 卡片标题
          help: 留空则按勾选的平台自动起名：只勾 Epic 叫「Epic 限免」，只勾一个别的平台叫「Steam 限免」「GOG 限免」，勾了多个叫「游戏限免」。
        - $formkit: text
          name: api
          label: Epic 数据接口
          help: 留空就行——内置的第一个就是 https://api.miao.club/api/epic/free，后面还有几个公共接口兜底。想用自己部署的接口再填（要带 CORS 头；站点是 https 的话接口也必须是 https）。api.miao.club / 聚合 API、Epic 官方原始格式、60s / UAPI 三种返回格式都能识别。
        - $formkit: select
          name: fallback
          label: 自己的接口失败时
          value: "on"
          help: 只在上面填了接口时有意义。退回内置接口意味着访客的浏览器会直连第三方（api.miao.club、uapis.cn、60s 社区实例），介意的话选「不退回」，那样接口挂了卡片就不出现。
          options:
            - label: 退回内置的公共接口
              value: "on"
            - label: 不退回
              value: "off"
        - $formkit: number
          name: count
          number: "integer"
          min: 1
          max: 12
          label: 卡片里最多显示几个
          value: 4
        - $formkit: select
          name: upcoming
          label: 显示「即将限免」
          value: "on"
          help: 只有 Epic 会提前公布下一批，Steam 和 GOG 没有「即将限免」。
          options:
            - label: 显示
              value: "on"
            - label: 只显示正在限免的
              value: "off"
        - $formkit: number
          name: cache_hours
          number: "integer"
          min: 1
          max: 48
          label: 本地缓存时长（小时）
          value: 3
          help: 访客浏览器里缓存多久再去请求接口。限免一周才换一次，没必要太勤。
        - $formkit: text
          name: more_link
          label: 「显示更多」链接
          help: 留空时，只勾了一个平台就去那家商店的限免页；勾了多个平台就不显示这个链接。新建一个独立页面并选用「游戏限免」模板后，可以把它的地址（例如 /epic）填在这里。

    # ================================================================ 外观
    - group: style
      label: 外观
      formSchema:
        - $formkit: select
          name: background
          label: 默认背景
          value: "auto"
          help: 访客可以在「显示」面板里自己改，这里只是初始值
          options:
            - label: 跟随系统
              value: auto
            - label: 浅色
              value: light
            - label: 暗淡
              value: dim
            - label: 夜间
              value: dark
        - $formkit: select
          name: accent
          label: 默认强调色
          value: "blue"
          options:
            - label: 蓝
              value: blue
            - label: 黄
              value: yellow
            - label: 粉
              value: pink
            - label: 紫
              value: purple
            - label: 橙
              value: orange
            - label: 绿
              value: green
        - $formkit: select
          name: font_size
          label: 默认字号
          value: "3"
          options:
            - label: 最小
              value: "1"
            - label: 小
              value: "2"
            - label: 标准
              value: "3"
            - label: 大
              value: "4"
            - label: 最大
              value: "5"
        - $formkit: select
          name: avatar_shape
          label: 头像形状
          value: "circle"
          options:
            - label: 圆形
              value: circle
            - label: 方形
              value: square
        - $formkit: select
          name: feed_style
          label: 文章列表样式
          value: "x"
          help: 访客可以自己改（首页标签栏右边的按钮，或者「显示」面板里的「列表样式」），选过之后以他自己的为准；这里设的是没改过的人看到的样子。作用范围是首页、探索、分类、标签和搜索结果
          options:
            - label: X 时间线（头像、正文、互动按钮）
              value: "x"
            - label: 博客列表（大标题、两行摘要、右侧缩略图）
              value: blog
        - $formkit: text
          name: font_family
          label: 自定义字体
          help: 例如 "Noto Sans SC", sans-serif。留空则使用系统字体栈（和 X 一样）。字体文件要自己在「代码注入」里引入
        - $formkit: text
          name: icon_cdn
          label: 图标脚本地址
          value: "https://cdn.jsdelivr.net/npm/iconify-icon@2/dist/iconify-icon.min.js"
          help: 图标用 iconify 渲染。CDN 打不开会导致图标不显示，介意的话把这个文件下载下来传到附件里，再把地址换成自己的
        - $formkit: text
          name: highlight_cdn
          label: 代码高亮脚本地址
          value: "https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/highlight.min.js"
          help: 只在页面里真的有代码块时才加载，同样可以换成自托管地址

    # ================================================================ 功能
    - group: features
      label: 功能
      formSchema:
        - $formkit: select
          name: infinite
          label: 无限滚动
          value: "on"
          help: 滚到底部自动加载下一页
          options:
            - label: 开启
              value: "on"
            - label: 关闭（用分页按钮）
              value: "off"
        - $formkit: select
          name: shortcuts
          label: 键盘快捷键
          value: "on"
          help: 按 ? 可以查看全部快捷键
          options:
            - label: 开启
              value: "on"
            - label: 关闭
              value: "off"
        - $formkit: select
          name: lightbox
          label: 图片灯箱
          value: "on"
          options:
            - label: 开启
              value: "on"
            - label: 关闭
              value: "off"
        - $formkit: select
          name: soft_nav
          label: 无刷新切页
          value: "on"
          help: 站内链接不再整页重载，只换中间那一栏，左右两栏原地不动——没有白屏，右栏的滚动位置和搜索框里的字也不会丢。浏览器不支持或者中途出错会自动退回普通跳转
          options:
            - label: 开启
              value: "on"
            - label: 关闭
              value: "off"
        - $formkit: select
          name: hide_bars
          label: 手机上滚动时收起顶栏和底栏
          value: "on"
          help: 往下读时两条栏让出位置，手指往下一拨就回来，和 X 一样。关掉则两条栏一直固定显示
          options:
            - label: 开启
              value: "on"
            - label: 关闭（一直显示）
              value: "off"
        - $formkit: select
          name: pull_refresh
          label: 手机浏览器下拉刷新
          value: "off"
          help: 默认拦掉：在页面顶上往下拉不会整页刷新，免得想拉出顶栏时误触。想保留浏览器自带的下拉刷新就选「保留」
          options:
            - label: 拦掉（推荐）
              value: "off"
            - label: 保留
              value: "on"
        - $formkit: select
          name: alt_badge
          label: 图片 ALT 徽标
          value: "on"
          help: 带描述文字的图片左下角会出现一个 ALT 角标，点一下看描述，和 X 一样
          options:
            - label: 开启
              value: "on"
            - label: 关闭
              value: "off"
        - $formkit: select
          name: bookmarks
          label: 书签
          value: "on"
          help: 收藏记录保存在访客自己的浏览器里
          options:
            - label: 开启
              value: "on"
            - label: 关闭
              value: "off"
        - $formkit: select
          name: relative_time
          label: 相对时间
          value: "on"
          help: 一分钟内「刚刚」，一小时内「N分钟」，一天内「N小时」，一周内「N天」，同一年「9月19日」，更早的带年份（X 的风格，不带「前」字）
          options:
            - label: 开启
              value: "on"
            - label: 关闭
              value: "off"
        - $formkit: select
          name: new_posts
          label: 新文章提示
          value: "on"
          help: 页面开着的时候有新文章，顶部会冒出「显示 N 条新帖」
          options:
            - label: 开启
              value: "on"
            - label: 关闭
              value: "off"
        - $formkit: select
          name: code_copy
          label: 代码块复制按钮
          value: "on"
          options:
            - label: 开启
              value: "on"
            - label: 关闭
              value: "off"
        - $formkit: select
          name: code_highlight
          label: 代码语法高亮
          value: "on"
          help: 页面里有代码块时才会去加载高亮脚本，配色跟着主题的三套背景走
          options:
            - label: 开启
              value: "on"
            - label: 关闭
              value: "off"
        - $formkit: select
          name: thumbnails
          label: 图片缩略图
          value: "on"
          help: 列表与网格里的图片走 Halo 的缩略图接口，取不到会自动退回原图
          options:
            - label: 开启
              value: "on"
            - label: 关闭
              value: "off"
        - $formkit: select
          name: restore_scroll
          label: 记住浏览位置
          value: "on"
          help: 无限滚动翻了很多页之后，点进文章再返回能回到原来的地方
          options:
            - label: 开启
              value: "on"
            - label: 关闭
              value: "off"
        - $formkit: select
          name: reading_progress
          label: 阅读进度条
          value: "on"
          options:
            - label: 开启
              value: "on"
            - label: 关闭
              value: "off"

    # ================================================================ 高级
    - group: advanced
      label: 高级
      formSchema:
        - $formkit: code
          name: custom_css
          label: 自定义 CSS
          language: css
          height: 200px
        - $formkit: code
          name: custom_js
          label: 自定义 JavaScript
          language: javascript
          height: 200px
        - $formkit: code
          name: head_html
          label: 注入到 head
          language: html
          height: 150px
        - $formkit: code
          name: footer_html
          label: 注入到 body 末尾
          language: html
          height: 150px

apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: theme-x-post-display
spec:
  targetRef:
    group: content.halo.run
    kind: Post
  # 选项值一律加引号：裸写的 on / off 会被 Halo 读成布尔值，存下来变成 "true" / "false"，模板就认不出了
  formSchema:
    - $formkit: select
      name: theme-x.halo.run/summary
      label: AI 摘要卡片
      value: default
      help: 只控制文章页的卡片；文章摘要仍由 Halo 或摘要生成器保存。
      options:
        - label: 跟随主题设置
          value: default
        - label: 显示
          value: "on"
        - label: 隐藏
          value: "off"
    - $formkit: select
      name: theme-x.halo.run/toc
      label: 文章目录
      value: default
      help: 显示时从正文标题生成目录；少于两个标题时不出现。
      options:
        - label: 跟随主题设置
          value: default
        - label: 显示
          value: "on"
        - label: 隐藏
          value: "off"
    - $formkit: select
      name: theme-x.halo.run/aside
      label: 桌面右栏
      value: default
      options:
        - label: 跟随主题布局
          value: default
        - label: 显示
          value: "on"
        - label: 隐藏
          value: "off"
    - $formkit: select
      name: theme-x.halo.run/related
      label: 相关文章
      value: default
      help: 普通文章默认跟随主题设置；长文默认不显示，可在这里单独开启。
      options:
        - label: 跟随主题设置
          value: default
        - label: 显示
          value: "on"
        - label: 隐藏
          value: "off"
    - $formkit: text
      name: theme-x.halo.run/download-github
      label: 资源下载 · GitHub 地址
      help: 填完整的 https:// 链接；留空则不显示 GitHub 按钮。
    - $formkit: text
      name: theme-x.halo.run/download-baidu
      label: 资源下载 · 百度网盘地址
      help: 填自己的分享链接；留空则不显示百度网盘按钮。
    - $formkit: text
      name: theme-x.halo.run/download-baidu-code
      label: 资源下载 · 百度网盘提取码
      help: 有百度网盘地址时才会显示。
    - $formkit: text
      name: theme-x.halo.run/download-other
      label: 资源下载 · 其他地址
      help: 可填 Gitee、其他网盘等完整的 https:// 链接。
    - $formkit: text
      name: theme-x.halo.run/download-other-label
      label: 资源下载 · 其他入口名称
      help: 例如 Gitee、夸克网盘；留空时显示「其他下载」。
